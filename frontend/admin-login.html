<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | TRIMORA</title>
<link rel="stylesheet" href="css/admin-login.css">
</head>
<body>
<header><a href="index.html" class="logo"><img src="images/logo.png" alt="TRIMORA Logo"></a><a href="index.html" class="back-link">← Back to Home</a></header>
<main class="auth-page"><section class="auth-card">
<p class="panel-label">TRIMORA ADMINISTRATION</p>
<h1>Admin Login</h1>
<p class="intro">Sign in to manage your shop, team and appointments.</p>
<form id="admin-login-form">
<label for="admin-email">Email Address</label>
<input type="email" id="admin-email" placeholder="Enter admin email" autocomplete="username" required>
<label for="admin-password">Password</label>
<div class="password-box"><input type="password" id="admin-password" placeholder="Enter password" autocomplete="current-password" required><button type="button" id="toggle-password" aria-label="Show password">👁</button></div>
<p class="error-message" id="login-error" role="alert"></p>
<button type="submit" class="login-btn">Login as Admin ➜</button>
</form>
<p class="login-note">Authorized shop administrator access only.</p>
</section></main>
<script src="js/admin-login.js"></script>
</body></html>
