
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TRIMORA</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="TRIMORA Logo">
        </a>

        <nav id="nav-menu">
            <a href="admin-login.html">Admin Login</a>
            <a href="barber-login.html">Barber Login</a>
            <a href="index.html">← Back to Home</a>
        </nav>

        <button class="menu-toggle" id="menu-toggle" type="button"
            aria-label="Toggle navigation" aria-expanded="false">
            ☰
        </button>
    </header>

    <main class="auth-page">
        <div class="auth-card">

            <div class="auth-header">
                <h1>Welcome to TRIMORA</h1>
                <p>Login or create your account to book an appointment.</p>
            </div>

            <div class="auth-tabs">
                <div class="tab-slider"></div>
                <button class="tab active" type="button">Login</button>
                <button class="tab" type="button">Register</button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email"
                        placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" id="password"
                            placeholder="Enter your password">
                        <button type="button" id="toggle-password">👁</button>
                    </div>
                </div>

                <div class="form-option">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" id="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn">Login</button>
            </form>

            <div class="register-form" id="register-form">
                <form id="registration-form">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="register-name"
                            placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="register-email"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-box">
                            <input type="password" id="register-password"
                                placeholder="Create a password" required>
                            <button type="button" id="toggle-register-password">👁</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="password-box">
                            <input type="password" id="confirm-password"
                                placeholder="Confirm your password" required>
                            <button type="button" id="toggle-confirm-password">👁</button>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">Register</button>
                </form>
            </div>

            <p class="switch-tect">
                Don't have an account?
                <button type="button">Register</button>
            </p>

        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
