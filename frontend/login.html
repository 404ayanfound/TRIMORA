<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TRIMORA</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="TRIMORA Logo">
        </a>
        <a href="index.html">← Back to Home</a>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome to TRIMORA</h1>
                <P>Login or create your account to book an appointment.</P>
            </div>

            <div class="auth-tabs">
                <div class="tab-slider"></div>
                <button class="tab active">Login</button>
                <button class="tab">Register</button>
            </div>

            <form>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enterr your email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                     <div class="password-box">
                        <input type="password" placeholder="Enter your password">
                        <button type="button" id="toggle-password">👁</button>
                    </div>
                </div>

                <div class="form-option">
                    <label>
                        <input type="checkbox">Remember me
                    </label>
                    <a href="#" id="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn">Login</button>
            </form>

            <div class="register-form" id="register-form">
                <form>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create a password">
                    </div>

                    <div class="form-group">
                        <label>Confirm password</label>
                        <input type="password" placeholder="Confirm your password"> 
                    </div>

                    <button type="submit" class="auth-btn">Register</button>
                </form>
            </div>

            <p class="switch-tect"> Don't have an account?
                <button type="button">Register</button>
            </p>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
