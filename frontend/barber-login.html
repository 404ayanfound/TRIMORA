<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Login | TRIMORA</title>
    <link rel="stylesheet" href="css/barber-login.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="TRIMORA Logo">
        </a>

        <nav id="nav-menu">
            <a href="index.html">← Back to Home</a>
        </nav>

        <button class="menu-toggle" id="menu-toggle" type="button"
            aria-label="Toggle navigation" aria-expanded="false">
            ☰
        </button>
    </header>

    <main class="auth-page">
        <div class="auth-card">

            <div class="auth-header">
                <p class="panel-label">TRIMORA BARBER PANEL</p>
                <h1>Welcome Back</h1>
                <p>Login to manage your appointments and customer queue.</p>
            </div>

            <form id="barber-login-form">

                <div class="form-group">
                    <label for="barber-email">Email Address</label>
                    <input type="email" id="barber-email"
                        placeholder="Enter your registered email" required>
                </div>

                <div class="form-group">
                    <label for="barber-password">Password</label>

                    <div class="password-box">
                        <input type="password" id="barber-password"
                            placeholder="Enter your password" required>

                        <button type="button" id="toggle-password"
                            aria-label="Show password">👁</button>
                    </div>
                </div>

                <button type="submit" class="auth-btn">
                    Login as Barber
                </button>

            </form>

            <p class="login-note">
                Don't have an account?
                <span>Contact Admin to create your account.</span>
            </p>

        </div>
    </main>

    <script src="js/barber-login.js"></script>
</body>
</html>
